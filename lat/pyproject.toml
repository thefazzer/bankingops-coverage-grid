[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lat"
version = "0.1.0"
description = "Lineage Attestation Toolkit (SPEC-02): span commitments, per-atom lineage, examiner verification"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
    "click>=8",
    "regex>=2023",
    "datasketch>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lat = "lat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
