# Increment: x-preview-f-free only. Identical to panel-live.yaml except max_tokens 64000 —
# this model spends a large share of its budget on reasoning_content and truncated (finish_reason=length)
# at 32000 on samples 0 and 2. The cap is a ceiling, not a sampling parameter; models that stopped
# naturally below 32000 are unaffected. Deviation recorded here and in the bundle notes.
params: {threshold_usd: 200000, currency: USD, as_of_year: 2025}
samples: 3
call: {temperature: 0.2, top_p: 1.0, max_tokens: 64000, seed_base: 1000, timeout_s: 2400, stream: true}
models:
  - {provider: generic_openai_compatible, model: x-preview-f-free, vendor: opencode-zen,
     base_url: "https://opencode.ai/zen/v1", api_key_env: ZEN_API_KEY}
